<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Trường Đại Học Bạc Liêu</title>
</head>
<body>

<script>
    var Ten, Tuoi;

    Ten = prompt("Bạn hãy nhập vào tên:", "");
    Tuoi = prompt("Bạn hãy nhập vào tuổi:", "");

    document.write("Chào bạn: <b>" + Ten + "</b>");
    document.write("<br>");
    document.write("Tuổi của bạn là: <u>" + Tuoi + "</u>");
</script>

</body>
</html>
