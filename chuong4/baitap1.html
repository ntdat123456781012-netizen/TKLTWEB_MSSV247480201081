<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Trường Đại Học Bạc Liêu</title>
</head>
<body>
<script>
    var hoten, lop;

    hoten = prompt("Nhập họ tên sinh viên:", "");
    lop = prompt("Nhập lớp:", "");

    document.write("<h1 style='color:red'>TRƯỜNG ĐẠI HỌC BẠC LIÊU</h1>");
    document.write("<h2 style='color:blue'>KHOA CÔNG NGHỆ THÔNG TIN</h2>");

    document.write("<font size='4' color='black'><b>Lớp học: " + lop + "</b></font><br><br>");

    document.write("<font size='4' color='green'>Họ tên sinh viên: " + hoten + "</font>");
</script>
</body>
