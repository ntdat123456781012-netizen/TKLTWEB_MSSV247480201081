<!DOCTYPE html>
<html>
<head>
    <title>BaitapJavascript2b</title>
</head>
<body>

<script>
    document.write("<h2>Tạo Button và Textbox</h2><br>");
</script>

<form>
    <input type="text" name="txtthongbao" id="txtthongbao">

    <input type="button"
           name="Hello"
           value="Hello"
           onclick="document.getElementById('txtthongbao').value='Hello JavaScript';">
</form>

</body>
</html>
