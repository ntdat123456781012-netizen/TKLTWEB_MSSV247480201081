<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>cau2a</title>
</head>
<body>

<script>
    document.write("<h1>Tạo Button bằng Script</h1><br>");

    function thongbao(txt)
    {
        alert(txt);
    }
</script>

<form>
    <input type="button"
           name="callthongbao"
           value="Thông báo"
           onclick="thongbao('Welcome to javascript!')">
</form>

</body>
</html>
